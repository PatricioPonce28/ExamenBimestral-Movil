<ion-header class="ion-no-border" [translucent]="true">
  <ion-toolbar color="transparent">
    <!-- Quitamos la flecha porque esta es la pantalla inicial -->
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="login-bg">

  <!-- Wrapper que fuerza el centrado perfecto -->
  <div class="login-master-wrapper">

    <!-- Logo + Nombre -->
    <div class="brand-container">
      <div class="logo-backdrop">
        <ion-icon name="phone-portrait" class="main-logo"></ion-icon>
      </div>
      <h1>Tigo Conecta</h1>
      <p class="tagline">Planes móviles que conectan tu mundo</p>
    </div>

    <!-- Tarjeta de login -->
    <div class="login-card-elevated">

      <h2>¡Hola de nuevo!</h2>
      <p class="welcome-text">Ingresa para ver los mejores planes</p>

      <!-- Formulario -->
      <form (ngSubmit)="login()" class="login-form">

        <ion-item class="modern-input" lines="none">
          <ion-icon name="mail" slot="start"></ion-icon>
          <ion-label position="floating">Correo electrónico</ion-label>
          <ion-input 
            type="email" 
            [(ngModel)]="email" 
            name="email"
            required
            placeholder="ejemplo@tigo.com">
          </ion-input>
        </ion-item>

        <ion-item class="modern-input" lines="none">
          <ion-icon name="lock-closed" slot="start"></ion-icon>
          <ion-label position="floating">Contraseña</ion-label>
          <ion-input 
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password" 
            name="password"
            required>
          </ion-input>
          <ion-icon 
            slot="end"
            [name]="showPassword ? 'eye-off' : 'eye'"
            (click)="togglePassword()"
            class="eye-icon">
          </ion-icon>
        </ion-item>

        <ion-button 
          type="submit"
          expand="block" 
          class="tigo-btn-login"
          [disabled]="!email || !password">
          <ion-icon name="log-in" slot="start"></ion-icon>
          Iniciar Sesión
        </ion-button>

        <div class="recovery-link">
          <ion-button fill="clear" size="small" (click)="irARecuperarPassword()">
            ¿Olvidaste tu contraseña?
          </ion-button>
        </div>

      </form>

      <div class="divider-or">
        <span>o continúa como</span>
      </div>

      <ion-button 
        expand="block" 
        fill="outline" 
        class="btn-invitado"
        (click)="continuarComoInvitado()">
        <ion-icon name="person-circle" slot="start"></ion-icon>
        Invitado
      </ion-button>

      <div class="register-prompt">
        <span>¿Primera vez aquí? </span>
        <ion-button fill="clear" class="register-now" (click)="irARegistro()">
          Crear cuenta gratis
        </ion-button>
      </div>

    </div>

    <div class="footer-copy">
      <small>© 2025 Tigo Conecta • Todos los derechos reservados</small>
    </div>

  </div>

</ion-content>
